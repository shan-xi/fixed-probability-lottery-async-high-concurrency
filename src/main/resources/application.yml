spring:
  application:
    name: fixed-probability-lottery-async
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lottery}
    username: ${DB_USERNAME:lottery}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: lottery-draw-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

lottery:
  limited-prizes:
    prize-1-quota: ${PRIZE_1_QUOTA:1}
    prize-2-quota: ${PRIZE_2_QUOTA:10}
  kafka:
    topic: ${LOTTERY_TOPIC:lottery.draw.requested}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:250}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
