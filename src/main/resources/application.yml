spring:
  application:
    name: fixed-probability-lottery-async
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lottery}
    username: ${DB_USERNAME:lottery}
    password: ${DB_PASSWORD:change-me}
    hikari:
      # Keep total pools across all API/worker replicas below PostgreSQL max_connections.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      validation-timeout: 1000
      pool-name: LotteryHikariPool
      register-mbeans: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: lottery-draw-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
server:
  port: ${SERVER_PORT:8080}
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

lottery:
  limited-prizes:
    prize-1-quota: ${PRIZE_1_QUOTA:1}
    prize-2-quota: ${PRIZE_2_QUOTA:10}
  kafka:
    topic: ${LOTTERY_TOPIC:lottery.draw.requested}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:250}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
